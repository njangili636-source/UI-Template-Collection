<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Teja naik Apps</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0
        }
        
        body {
            font-family: Georgia, serif;
            background: #16202a;
            color: #f2efe8;
            min-height: 100vh;
            padding: 48px 20px
        }
        
        main {
            max-width: 900px;
            margin: auto
        }
        
        h1 {
            font-size: clamp(2rem, 6vw, 3.6rem);
            font-weight: 400;
            margin-bottom: 8px
        }
        
        p.s {
            color: #9fb0bd;
            margin-bottom: 36px;
            font-family: system-ui, sans-serif
        }
        
        .g {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px
        }
        
        a {
            display: block;
            padding: 28px 22px;
            border-radius: 4px 22px 4px 22px;
            text-decoration: none;
            color: inherit;
            min-height: 150px;
            transition: transform .2s
        }
        
        a:hover,
        a:focus-visible {
            transform: translateY(-4px);
            outline: 2px solid #fff
        }
        
        a b {
            font-size: 1.4rem;
            display: block;
            margin-bottom: 8px
        }
        
        a span {
            font: .9rem system-ui, sans-serif;
            opacity: .85
        }
        
        .f {
            background: #1d4e89
        }
        
        .c {
            background: #b5452b
        }
        
        .a {
            background: #5b3f8c
        }
        
        .n {
            background: #2f6f4f
        }
    </style>
</head>

<body>
    <main>
        <h1>Teja Naik Apps</h1>
        <p class="s">Four small web apps. Pick one to open.</p>
        <div class="g"><a class="f" href="FlightDeck/index.html"><b>FlightDeck</b><span>Search and filter a live-style departures board.</span></a>
            <a class="c" href="ChefMate/index.html"><b>ChefMate</b><span>Find recipes by ingredient and scale servings.</span></a>
            <a class="a" href="ArtSpace/index.html"><b>ArtSpace</b><span>Browse a gallery and open works full size.</span></a>
            <a class="n" href="NewsPulse/index.html"><b>NewsPulse</b><span>Read headlines by topic and save favorites.</span></a></div>
    </main>
</body>


</head>

</html>
