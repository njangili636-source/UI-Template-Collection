<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerHub</title><link rel="stylesheet" href="style.css"></head><body><main class="container">
<header class="nav"><div class="brand"><div class="logo">◆</div><div><h1>CareerHub</h1><p>Skills, internships & career</p></div></div><div class="search"><input id="search" placeholder="Search Python, internship, web..."><button>⌕</button></div><div class="nav-actions"><button class="navbtn" id="theme">☾</button><button class="navbtn" id="fav">♡ <b id="favCount">0</b></button><button class="navbtn" id="workbtn">▣ <b id="workCount">0</b></button></div></header>
<section class="hero"><h2>Find a direction and take the next step.</h2><p>Explore Python, web development, internships, data, design and more.</p></section>
<div class="toolbar" id="cats"><button class="pill active" data-cat="All">All</button><button class="pill " data-cat="Python">Python</button><button class="pill " data-cat="Web Development">Web Development</button><button class="pill " data-cat="Internship">Internship</button><button class="pill " data-cat="Data">Data</button><button class="pill " data-cat="Design">Design</button><button class="pill " data-cat="Programming">Programming</button><button class="pill " data-cat="Security">Security</button><button class="pill " data-cat="Cloud">Cloud</button><button class="pill " data-cat="AI / ML">AI / ML</button><select class="sort" id="sort"><option value="default">Sort by</option><option value="rating">Highest rated</option><option value="name">Name</option></select></div>
<div class="section-head"><div><h2>Explore Career Paths</h2><p id="count"></p></div></div><section class="grid" id="cards"></section>
<section id="workspace"><div class="section-head"><div><h2>My Career Workspace</h2><p>Saved items and actions.</p></div></div><div class="panel" id="work"></div></section></main>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Details</h2><button class="close" id="close">×</button></div><div id="modalContent"></div></div></div>
<div class="player" id="player"><div class="player-info"><b id="ptitle"></b><span id="partist"></span></div><button id="prev">↶</button><button id="pp">▶</button><button id="next">↷</button><input id="vol" type="range" min="0" max="1" step=".01" value=".8"><audio id="audio"></audio></div>
<script src="script.js"></script></body></html>
